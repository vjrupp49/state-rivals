# Weight of MEASURED co-search shares in splitting a team's rivalry salience among its rivals (see docs/COSEARCH_PILOT.md).
# Rule, set before looking at ranking effects: lam = clamp(mean within-team Spearman of the league's pilot, 0, 0.4);
# leagues with fewer than ~15 teams tested or a non-positive correlation get 0 (nba: 9 teams, rho -0.05).
# Place factor (protocol revision D-016): hostility toward a team shrinks by exp(-place_gamma * miles/1000) beyond what the rivalry
# structure predicts. Pooled NFL (0.353) and MLB (0.312) estimates from scripts/gravity_distance.py, rounded; adopted under the
# pre-registered rule in docs/RIVALRY_WEIGHT_DESIGN.md (90% interval excludes zero for at least two leagues). 0 disables it.
place_gamma: 0.33
cosearch_blend: {nfl: 0.34, mlb: 0.4, nba: 0.0, nhl: 0.0, col: 0.36}   # nhl: only 12 teams tested, so 0 under the stated rule
